name: Daily Standup Automation

on:
  schedule:
    # Runs at 09:00 UTC Monday through Friday
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  standup:
    name: Generate Standup Brief
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Standup Brief
      env:
        JIRA_URL: ${{ secrets.JIRA_URL }}
        JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
        JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      run: |
        python -m sprint_guardian --mode standup-brief --output-file automation/output/latest-standup.md

    - name: Upload Standup Artifact
      uses: actions/upload-artifact@v4
      with:
        name: daily-standup-brief
        path: automation/output/latest-standup.md
