[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codinzhub-sprint-guardian"
version = "1.0.0"
authors = [
  { name = "Rohinth S", email = "imt_2024068@iiitm.ac.in" }
]
description = "AI-Powered Agile Sprint Orchestrator for Jira task triage, load balancing, and standups with Human-in-the-Loop guardrails."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "requests>=2.28.0",
    "tabulate>=0.9.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "hypothesis>=6.80.0",
]

[project.scripts]
sprint-guardian = "sprint_guardian.cli:main"
sprint-guardian-mcp = "sprint_guardian.mcp_server:main"
